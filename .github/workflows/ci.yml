name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      # Cette étape est volontairement cassée pour le TP 3.2
      - name: Force failure
        run: exit 1

      - name: Build image
        run: docker build -t myapp:${{ github.sha }} ..