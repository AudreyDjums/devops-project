
name: Terraform CI

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform -chdir=infra/envs/dev init -backend=false

      - name: Terraform Format Check
        run: terraform -chdir=infra/envs/dev fmt -check

      - name: Terraform Validate
        run: terraform -chdir=infra/envs/dev validate

  plan:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure CI local backend
        run: |
          terraform -chdir=infra/envs/dev init -reconfigure -backend-config="path=ci.tfstate"

      - name: Terraform Plan
        run: |
          set -o pipefail
          terraform -chdir=infra/envs/dev plan -input=false -no-color -var-file=dev.tfvars | tee terraform-plan.txt

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform-plan.txt
          retention-days: 7

  
  security:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/
          framework: terraform
          soft_fail: false
          output_format: cli

