apiVersion: apps/v1
kind: Deployment

metadata:
  name: myapp
  annotations:
    commit-sha: "202f668e0bdebe49f15a9726cf6a4449373727b1"
    pipeline-run: "https://github.com/AudreyDjums/devops-project/actions"
    owner: "Mauranne"
    ticket: "DEVOPS-001"

spec:
  replicas: 3

  selector:
    matchLabels:
      app: myapp

  template:
    metadata:
      labels:
        app: myapp

    spec:
      containers:
        - name: myapp
          image: ghcr.io/audreydjums/devops-project:202f668e0bdebe49f15a9726cf6a4449373727b1

          ports:
            - containerPort: 3000

          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: myapp-config
                  key: APP_ENV
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: myapp-secret
                  key: API_KEY

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15

          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"